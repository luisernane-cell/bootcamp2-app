# Configuração do Nginx da Minha Estante (introduzida na versão 1.1).
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Comprime HTML, CSS e JS antes de enviar: menos bytes trafegando.
    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/javascript;

    # Cabeçalhos básicos de segurança.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # CSS e JS podem ficar 10 minutos no cache do navegador.
    # (add_header dentro de um location substitui os de fora, por isso repetimos.)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
